spring:
  application:
    name: marketplace-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ouroboros}
    driver-class-name: org.postgresql.Driver

  springdoc:
    api-docs:
      path: /api-docs

    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method
      tagsSorter: alpha
      display-request-duration: true